# Prometheus 抓取配置（对应专栏第 15 章：file_sd 动态发现 + 静态配置）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # node-exporter：OS 实证层数据源（Ch11/Ch15），实例名对齐 analyze.py 硬编码 10.0.0.5:9100
  - job_name: node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s

  # OAP telemetry（SW_TELEMETRY=prometheus，/metrics），可选观测
  - job_name: skywalking-oap
    metrics_path: /metrics
    static_configs:
      - targets: ["oap:1234"]
